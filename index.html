<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Ciclo da Borboleta</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    html, body {
      margin: 0;
      padding: 0;
      min-height: 100vh;
      background: linear-gradient(135deg, #f9f6ff 0%, #d7f0ea 100%);
      font-family: sans-serif;
    }
    #container {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      padding: 20px 10px;
    }
    /* Top bar */
    #top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #fff;
      border-radius: 16px;
      padding: 16px 24px;
      margin-bottom: 18px;
      box-shadow: 0 4px 24px #6d83f218;
    }
    .top-icons {
      display: flex;
      gap: 20px;
      align-items: center;
    }
    .icon-placeholder {
      width: 36px;
      height: 36px;
      background: linear-gradient(135deg, #6d83f2 60%, #8ecae6 100%);
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-size: 1.2rem;
      font-weight: bold;
      letter-spacing: 1px;
      box-shadow: 0 2px 8px #43568a22;
    }
    .level-badge {
      background: linear-gradient(90deg, #fbbf24 60%, #d97706 100%);
      color: #fff;
      font-weight: bold;
      font-size: 1rem;
      border-radius: 12px;
      padding: 5px 16px;
      margin-left: 12px;
      letter-spacing: 1px;
    }
    #title {
      position: absolute;
      left: 50%;
      top: 22px;
      transform: translateX(-50%);
      font-size: 1.8rem;
      font-weight: bold;
      background: linear-gradient(90deg, #6d83f2 60%, #8ecae6 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      font-family: Georgia, serif;
      letter-spacing: 2px;
    }
    /* Main content */
    #content {
      flex: 1;
      display: flex;
      align-items: center;
      gap: 32px;
      min-height: 380px;
    }
    #achievements {
      flex: 0 0 200px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }
    .medal {
      background: #fffefc;
      border-radius: 10px;
      border: 2px solid #e2e8f0;
      padding: 12px 16px;
      display: flex;
      align-items: center;
      gap: 10px;
      box-shadow: 0 2px 10px #6d83f212;
    }
    .medal-icon {
      width: 30px;
      height: 30px;
      background: #fbbf24;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      font-size: 1.1rem;
      font-weight: bold;
      border: 1px solid #d97706;
    }
    #center {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .gif-wrapper {
      width: 200px;
      height: 200px;
      background: rgba(255,255,255,0.85);
      border-radius: 50%;
      box-shadow: 0 8px 36px #6d83f228;
      border: 2.5px solid #e2e8f0;
      display: flex;
      align-items: center;
      justify-content: center;
      animation: pulse 2s ease-in-out infinite alternate;
    }
    @keyframes pulse {
      0% { transform: scale(0.96); }
      100% { transform: scale(1.03); }
    }
    .butterfly-gif {
      width: 120px;
      height: 120px;
      filter: drop-shadow(0 4px 16px #a7c8e633);
      animation: float 3s ease-in-out infinite alternate;
    }
    @keyframes float {
      0% { transform: translateY(0px) rotate(-2deg); }
      100% { transform: translateY(-12px) rotate(2deg); }
    }
    #game-panel {
      flex: 0 0 300px;
      background: #fff;
      border-radius: 16px;
      box-shadow: 0 6px 30px #43568a18;
      border: 2px solid #e2e8f0;
      padding: 22px 16px;
      min-width: 260px;
      max-width: 340px;
      display: flex;
      flex-direction: column;
      align-items: stretch;
    }
    #stages-title {
      text-align: center;
      font-weight: bold;
      color: #43568a;
      margin-bottom: 12px;
      font-size: 1.1rem;
      letter-spacing: 0.5px;
    }
    #stages {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }
    .slot {
      width: 100%;
      min-height: 64px;
      background: #f7fafc;
      border-radius: 10px;
      border: 2px dashed #a7c8e6;
      display: flex;
      align-items: center;
      padding: 6px 10px;
      transition: background 0.2s, border 0.2s;
      position: relative;
    }
    .slot.accepting {
      background: #e6f0ff;
      border: 2.5px solid #6d83f2;
    }
    .card {
      width: 52px;
      height: 52px;
      background: #fff;
      border-radius: 8px;
      box-shadow: 0 3px 12px #43568a18;
      border: 2px solid #d7e0f0;
      cursor: grab;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-right: 10px;
      transition: transform 0.16s;
      user-select: none;
    }
    .card.dragging {
      transform: scale(1.12) rotate(-4deg);
      box-shadow: 0 8px 24px #6d83f233;
      border: 3px solid #6d83f2;
    }
    .number-badge {
      background: #6d83f2;
      color: #fff;
      font-weight: bold;
      font-size: 0.95rem;
      border-radius: 50%;
      width: 22px;
      height: 22px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-right: 8px;
    }
    .btn {
      display: block;
      width: 100%;
      margin-top: 16px;
      background: linear-gradient(90deg, #4ade80 40%, #16a34a 100%);
      color: #fff;
      border: none;
      border-radius: 12px;
      padding: 12px 0;
      font-size: 1.05rem;
      font-weight: bold;
      cursor: pointer;
      box-shadow: 0 4px 18px #4ade8022;
      border: 2px solid #16a34a;
      transition: background 0.2s, transform 0.16s;
    }
    .btn:hover:not(:disabled) {
      background: linear-gradient(90deg, #86efac 40%, #4ade80 100%);
      color: #16a34a;
      transform: translateY(-2px) scale(1.03);
      border-color: #4ade80;
    }
    .btn:disabled {
      background: #e2e8f0;
      color: #a0aec0;
      cursor: not-allowed;
      border-color: #e2e8f0;
      box-shadow: none;
    }
    #feedback {
      text-align: center;
      margin-top: 10px;
      font-size: 1.02rem;
      font-weight: 600;
      min-height: 26px;
      color: #43568a;
    }
    #feedback.correct {
      color: #2f855a;
      background: #e2f8ee;
      border-radius: 6px;
      padding: 4px 0;
    }
    #feedback.wrong {
      color: #c53030;
      background: #ffebee;
      border-radius: 6px;
      padding: 4px 0;
    }
    @media (max-width: 900px) {
      #content {
        flex-direction: column;
        align-items: center;
        gap: 22px;
      }
      #achievements {
        flex-direction: row;
        flex-wrap: wrap;
        width: 100%;
        justify-content: center;
        gap: 10px;
      }
      #game-panel {
        width: 96vw;
        min-width: 240px;
        max-width: 420px;
      }
      .gif-wrapper {
        width: 140px;
        height: 140px;
      }
      .butterfly-gif {
        width: 85px;
        height: 85px;
      }
    }
  </style>
</head>
