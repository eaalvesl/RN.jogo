<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Jardim das Borboletas</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700&family=Quicksand:wght@500;700&display=swap" rel="stylesheet">
  <style>
    html, body {
      margin: 0;
      padding: 0;
      min-height: 100vh;
      background: linear-gradient(135deg, #f9f6ff 0%, #e0f2f1 100%);
      font-family: 'Quicksand', 'Montserrat', 'Segoe UI', sans-serif;
      color: #2d3748;
    }
    #main-container {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      background: linear-gradient(135deg, #f5f3fd 0%, #d7f0ea 100%);
    }
    /* ===== TOP BAR ===== */
    #top-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 22px 36px 14px 36px;
      background: rgba(255,255,255,0.96);
      border-bottom: 1.5px solid #e2e8f0;
      box-shadow: 0 4px 24px #6d83f212;
      position: relative;
      z-index: 10;
    }
    .top-icons {
      display: flex;
      gap: 26px;
      align-items: center;
    }
    .top-icon {
      display: flex;
      flex-direction: column;
      align-items: center;
      cursor: pointer;
      transition: transform 0.18s;
      padding: 4px 8px;
      border-radius: 8px;
      position: relative;
    }
    .top-icon:hover {
      transform: scale(1.08) translateY(-2px);
      background: #f3f4f6;
    }
    .icon-img {
      width: 34px;
      height: 34px;
      object-fit: contain;
      filter: drop-shadow(0 2px 8px #a7c8e622);
    }
    .icon-label {
      font-size: 0.85rem;
      color: #718096;
      margin-top: 2px;
      font-weight: 500;
      letter-spacing: 0.3px;
    }
    .level-badge {
      background: linear-gradient(90deg, #fbbf24 40%, #f59e0b 100%);
      color: #fff;
      font-weight: bold;
      font-size: 1.05rem;
      border-radius: 14px;
      padding: 6px 18px;
      margin-left: 18px;
      box-shadow: 0 2px 8px #fbbf2422;
      letter-spacing: 1px;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .title-placeholder {
      /* Espaço vazio para equilibrar a barra */
      width: 120px;
    }
    .game-title {
      position: absolute;
      left: 50%;
      top: 26px;
      transform: translateX(-50%);
      font-family: 'Montserrat', 'Georgia', serif;
      font-size: 2.1rem;
      font-weight: 700;
      color: #6d83f2;
      letter-spacing: 2px;
      text-shadow: 0 2px 12px #a7c8e622;
      background: linear-gradient(90deg, #6d83f2 60%, #8ecae6 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      text-fill-color: transparent;
    }

    /* ===== MAIN LAYOUT ===== */
    #content-area {
      display: flex;
      flex: 1;
      min-height: 0;
      padding: 32px 18px 24px 18px;
      gap: 28px;
    }
    /* Left panel - achievements */
    #achievements-panel {
      flex: 0 0 260px;
      display: flex;
      flex-direction: column;
      gap: 18px;
      align-items: stretch;
    }
    .panel-title {
      font-size: 1.18rem;
      font-weight: 700;
      color: #43568a;
      margin-bottom: 6px;
      letter-spacing: 0.5px;
      text-align: left;
    }
    .achievement-card {
      background: #fffefc;
      border-radius: 14px;
      border: 1.5px solid #e2e8f0;
      box-shadow: 0 2px 12px #6d83f212;
      padding: 16px 18px 14px 18px;
      display: flex;
      align-items: center;
      gap: 14px;
      margin-bottom: 6px;
      transition: background 0.18s, border 0.18s;
    }
    .achievement-card:last-child { margin-bottom: 0; }
    .achievement-card.unlocked {
      background: #f0fff4;
      border: 2px solid #48bb78;
      box-shadow: 0 2px 16px #48bb7822;
    }
    .medal-icon {
      width: 38px;
      height: 38px;
      object-fit: contain;
      filter: drop-shadow(0 2px 6px #a7c8e622);
    }
    .achievement-info {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      min-width: 0;
    }
    .achievement-name {
      font-weight: 700;
      font-size: 1.02rem;
      color: #2d3748;
      letter-spacing: 0.2px;
      margin-bottom: 2px;
    }
    .achievement-desc {
      font-size: 0.92rem;
      color: #718096;
      font-weight: 500;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .achievement-status {
      font-size: 0.9rem;
      color: #a0aec0;
      margin-left: 8px;
      font-weight: 500;
    }

    /* Center - butterfly GIF */
    #butterfly-center {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      min-width: 0;
      position: relative;
    }
    .butterfly-gif-wrapper {
      width: 220px;
      height: 220px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(255,255,255,0.78);
      border-radius: 50%;
      box-shadow: 0 8px 40px #6d83f222, 0 2px 12px #a7c8e618;
      border: 2.5px solid #e2e8f0;
      position: relative;
      /* Subtle pulsation */
      animation: pulseCenter 2.2s ease-in-out infinite alternate;
    }
    @keyframes pulseCenter {
      0% { transform: scale(0.96); box-shadow: 0 6px 32px #6d83f218; }
      100% { transform: scale(1.02); box-shadow: 0 10px 48px #6d83f228; }
    }
    .butterfly-gif {
      width: 140px;
      height: 140px;
      object-fit: contain;
      display: block;
      filter: drop-shadow(0 4px 16px #a7c8e633);
      /* Subtle float animation */
      animation: floatGif 3.2s ease-in-out infinite alternate;
    }
    @keyframes floatGif {
      0% { transform: translateY(0px) rotate(-2deg); }
      100% { transform: translateY(-14px) rotate(2deg); }
    }

    /* Right panel - game */
    #game-panel {
      flex: 0 0 360px;
      min-width: 300px;
      max-width: 420px;
      display: flex;
      flex-direction: column;
      align-items: stretch;
      background: rgba(255,255,255,0.92);
      border-radius: 20px;
      box-shadow: 0 6px 36px #43568a18;
      border: 2px solid #e2e8f0;
      padding: 28px 20px 24px 20px;
      min-height: 420px;
      position: relative;
    }
    #stages-title {
      text-align: center;
      font-weight: 700;
      font-size: 1.22rem;
      color: #43568a;
      margin-bottom: 10px;
      letter-spacing: 0.8px;
    }
    #stages-container {
      display: flex;
      flex-direction: column;
      gap: 18px;
      margin-bottom: 18px;
    }
    .stage-slot {
      width: 100%;
      min-width: 0;
      min-height: 72px;
      background: #f7fafc;
      border: 2px dashed #a7c8e6;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 8px 10px;
      transition: background 0.22s, border 0.22s;
      position: relative;
      box-shadow: 0 1px 6px #43568a0a;
    }
    .stage-slot.accepting {
      background: #e6f0ff;
      border: 2.5px solid #6d83f2;
      border-style: solid;
    }
    .stage-card {
      width: 58px;
      height: 58px;
      cursor: grab;
      background: #fff;
      border-radius: 10px;
      box-shadow: 0 4px 16px #43568a18, 0 1px 4px #8ecae618;
      border: 2px solid #d7e0f0;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform 0.16s, box-shadow 0.16s, border 0.16s;
      position: relative;
      user-select: none;
      opacity: 1;
      margin-right: 10px;
    }
    .stage-card.dragging {
      transform: scale(1.12) rotate(-4deg);
      box-shadow: 0 8px 28px #6d83f233, 0 3px 12px #8ecae622;
      border: 3px solid #6d83f2;
      opacity: 0.92;
      z-index: 100;
    }
    .stage-card.correct {
      border: 2.5px solid #48bb78;
      box-shadow: 0 3px 14px #48bb7818;
      filter: drop-shadow(0 0 6px #c6f6d5);
      pointer-events: none;
    }
    .stage-label {
      display: none;
    }
    .number-badge {
      background: #6d83f2;
      color: #fff;
      font-weight: bold;
      font-size: 1rem;
      border-radius: 50%;
      width: 26px;
      height: 26px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-right: 8px;
      box-shadow: 0 1px 6px #43568a12;
      flex-shrink: 0;
    }
    .stage-card.correct .number-badge {
      background: #48bb78;
    }
    .slot-info {
      display: flex;
      align-items: center;
      gap: 6px;
      color: #a0aec0;
      font-size: 0.95rem;
      font-weight: 500;
      letter-spacing: 0.3px;
    }
    .legend-mini {
      text-align: center;
      margin-top: 6px;
      color: #a0aec0;
      font-size: 0.88rem;
      letter-spacing: 0.2px;
    }

    /* Buttons (style matching the screenshot) */
    .game-btn {
      display: block;
      width: 100%;
      margin: 10px 0 0 0;
      background: linear-gradient(90deg, #4ade80 20%, #16a34a 80%);
      color: #fff;
      border: none;
      border-radius: 14px;
      padding: 13px 0;
      font-size: 1.08rem;
      font-weight: 700;
      font-family: 'Montserrat', 'Quicksand', sans-serif;
      cursor: pointer;
      box-shadow: 0 4px 18px #4ade8022;
      transition: 
        background 0.22s,
        transform 0.16s,
        box-shadow 0.18s;
      letter-spacing: 1.2px;
      outline: none;
      border: 2px solid #16a34a;
    }
    .game-btn:hover:not(:disabled) {
      background: linear-gradient(90deg, #86efac 20%, #4ade80 80%);
      color: #16a34a;
      transform: translateY(-2px) scale(1.03);
      box-shadow: 0 6px 26px #4ade8033;
      border-color: #4ade80;
    }
    .game-btn:disabled {
      background: #e2e8f0;
      color: #a0aec0;
      cursor: not-allowed;
      border-color: #e2e8f0;
      box-shadow: none;
      transform: none;
    }
    .restart-btn {
      background: linear-gradient(90deg, #fbbf24 20%, #d97706 80%);
      color: #fff;
      border-radius: 12px;
      border: 2px solid #d97706;
      margin-top: 8px;
      box-shadow: 0 3px 14px #fbbf2418;
    }
    .restart-btn:hover:not(:disabled) {
      background: linear-gradient(90deg, #fde68a 20%, #fbbf24 80%);
      color: #d97706;
      border-color: #fbbf24;
      transform: translateY(-2px) scale(1.03);
      box-shadow: 0 5px 20px #fbbf2428;
    }

    #feedback {
      text-align: center;
      margin-top: 14px;
      font-size: 1.05rem;
      font-weight: 600;
      min-height: 28px;
      letter-spacing: 0.3px;
      color: #43568a;
      transition: color 0.3s;
    }
    #feedback.correct {
      color: #2f855a;
      background: #e2f8ee;
      border-radius: 8px;
      padding: 6px 0;
      animation: popFeedback 0.44s cubic-bezier(.4,1.4,.6,1);
    }
    #feedback.wrong {
      color: #c53030;
      background: #ffebee;
      border-radius: 8px;
      padding: 6px 0;
      animation: shakeFeedback 0.55s;
    }
    @keyframes popFeedback {
      0% { transform: scale(0.92); opacity: 0; }
      60% { transform: scale(1.04); opacity: 1; }
      100% { transform: scale(1); }
    }
    @keyframes shakeFeedback {
      0% { transform: translateX(0); }
      20% { transform: translateX(-6px); }
      40% { transform: translateX(6px); }
      60% { transform: translateX(-4px); }
      80% { transform: translateX(4px); }
      100% { transform: translateX(0); }
    }

    /* Responsive */
    @media (max-width: 1100px) {
      #content-area {
        flex-direction: column;
        align-items: center;
        padding: 18px 6px 14px 6px;
        gap: 22px;
      }
      #achievements-panel {
        flex-direction: row;
        flex-wrap: wrap;
        gap: 12px;
        width: 100%;
        max-width: 680px;
        justify-content: center;
      }
      #butterfly-center {
        margin-bottom: 18px;
      }
      #game-panel {
        width: 96vw;
        max-width: 460px;
        min-width: 280px;
      }
      .butterfly-gif-wrapper {
        width: 160px;
        height: 160px;
      }
      .butterfly-gif {
        width: 98px;
        height: 98px;
      }
    }
    @media (max-width: 700px) {
      #top-bar {
        flex-direction: column;
        gap: 8px;
        padding: 14px 8px 6px 8px;
      }
      .game-title {
        top: 14px;
        left: 50%;
        font-size: 1.3rem;
        transform: translateX(-50%);
      }
      #content-area {
        padding: 6px 2px 6px 2px;
      }
      #game-panel {
        padding: 16px 6px 10px 6px;
      }
      .butterfly-gif-wrapper {
        width: 110px;
        height: 110px;
      }
      .butterfly-gif {
        width: 70px;
        height: 70px;
      }
    }
  </style>
</head>
