<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Borboletário — Jogo Offline</title>
  <style>
    body { font-family: 'Segoe UI', Arial, sans-serif; background: linear-gradient(135deg,#a8e6cf 0%,#dcedc8 100%); margin:0; min-height:100vh; }
    .container { max-width:740px; margin:28px auto; background:#fff9; border-radius:18px; padding:24px 28px 18px 28px; box-shadow:0 4px 28px #004d3722; }
    h1 { text-align:center; color:#2e7d32; margin-bottom:8px; }
    .tabs { display:flex; gap:6px; margin-bottom:16px; justify-content:center; }
    .tab { padding:9px 20px; border-radius:8px; cursor:pointer; background:#e8f5e9; color:#357a38; font-weight:500; border:none; }
    .tab.active { background:#7cb342; color:white; box-shadow:0 2px 8px #689f3844; }
    .section { display:none; }
    .section.active { display:block; animation:fadein 0.3s; }
    @keyframes fadein { from{opacity:0.4} to{opacity:1} }
    .status { text-align:center; margin-bottom:10px; color:#357a38; font-size:1.05em; }
    .stage { text-align:center; margin:10px 0 6px 0; font-size:1.2em; color:#00695c; font-weight:bold; }
    .butterfly-img { margin:12px auto; display:block; width:200px; height:140px; background:#f1f8e9; border-radius:14px; border:2px solid #b2ff59; box-shadow:0 2px 10px #004d5c11; position:relative; }
    .butterfly-img.flying { animation:fly 2.2s infinite alternate; }
    @keyframes fly { 0%{transform:translateY(0px) rotate(0deg);} 30%{transform:translateY(-14px) rotate(2deg);} 70%{transform:translateY(10px) rotate(-2deg);} 100%{transform:translateY(0px) rotate(0deg);} }
    .actions { text-align:center; margin:16px 0 6px 0; }
    button { background:#7cb342; color:white; border:none; padding:9px 18px; margin:0 5px; font-size:1em; border-radius:6px; cursor:pointer; transition:background 0.18s; }
    button:active { background:#558b2f; }
    button:disabled { background:#c8e6c9; color:#aaa; cursor:not-allowed; }
    .miniatures { display:flex; gap:9px; flex-wrap:wrap; justify-content:center; margin-top:6px; }
    .mini { width:56px; height:40px; border-radius:7px; border:2px solid #a5d6a7; background:#f5fff3; display:flex; align-items:center; justify-content:center; font-size:0.72em; position:relative; box-shadow:0 1px 3px #8bc34a22; }
    .mini.rare { border-color:#ffd600; box-shadow:0 0 8px #ffd600aa; filter:brightness(1.12); }
    .mini-label { position:absolute; bottom:0; left:0; right:0; background:rgba(255,255,255,0.85); font-size:0.6em; color:#33691e; font-weight:bold; border-radius:0 0 7px 7px; text-align:center; }
    .trait-editor { margin:12px 0; padding:12px; background:#f3ffe6; border-radius:9px; display:flex; flex-wrap:wrap; gap:13px; align-items:center; }
    .trait-editor label { font-size:0.92em; color:#2e7d32; margin-right:5px; }
    .color-picker { display:flex; gap:3px; }
    .color-btn { width:24px; height:24px; border-radius:5px; border:2px solid #8bc34a; cursor:pointer; }
    .color-btn.selected { border:3px solid #ffd600; box-shadow:0 0 6px #ffd60088; }
    .ranking-table { width:100%; border-collapse:collapse; margin-top:10px; }
    .ranking-table th, .ranking-table td { padding:5px 9px; text-align:left; border-bottom:1px solid #e0e0e0; }
    .ranking-table th { color:#2e7d32; background:#e8f5e9; }
    .tooltip { position:fixed; z-index:2000; background:#222; color:#fff; border-radius:6px; padding:6px 14px; opacity:0.95; pointer-events:none; left:200px; top:90px; }
    /* Modal share */
    .share-box { margin:10px 0; padding:7px 12px; background:#f3ffe6; border-radius:7px; display:flex; align-items:center; gap:7px; }
    .share-input { flex:1; padding:5px; border-radius:5px; border:1px solid #c8e6c9; font-size:0.92em; }
    .share-copied { color:#7cb342; font-size:0.92em; margin-left:5px; }
    /* Conquistas */
    .badge-list { display:flex; flex-wrap:wrap; gap:10px; margin-top:8px; justify-content:center; }
    .badge { background:#e8f5e9; border-radius:7px; padding:8px 14px; display:flex; align-items:center; gap:8px; box-shadow:0 1px 4px #8bc34a22; font-size:0.92em; }
    .badge.locked { background:#eceff1; color:#aaa; }
    .badge-icon { font-size:1.3em; }
    /* Share page */
    .share-page { text-align:center; padding:28px; background:#f5fff3; border-radius:14px; margin:20px auto; max-width:400px; box-shadow:0 2px 12px #004d3711; }
    .share-owner { font-size:0.95em; color:#357a38; margin-bottom:5px; }
    .share-id { font-size:0.8em; color:#888; margin-bottom:10px; }
    .share-back { background:#7cb342; color:white; border:none; padding:7px 18px; border-radius:7px; margin-top:8px; }
  </style>
</head>
<body>
  <!-- ===== PÁGINA COMPARTILHADA ===== -->
  <div id="share-page" class="share-page" style="display:none;">
    <div style="font-weight:bold;font-size:1.18em;color:#2e7d32;margin-bottom:7px;">Borboleta compartilhada 🦋</div>
    <div class="share-owner" id="share-owner"></div>
    <div class="share-id" id="share-id"></div>
    <div class="butterfly-img" id="share-img" style="margin:14px auto;"></div>
    <div style="margin:8px 0;font-size:0.93em;color:#33691e;" id="share-traits"></div>
    <button class="share-back" id="share-back">Voltar ao jogo</button>
  </div>

  <div class="container" id="main-container">
    <h1>Borboletário 🦋 — Offline</h1>
    <div class="tabs">
      <button class="tab active" data-tab="criar">Criar</button>
      <button class="tab" data-tab="galeria">Galeria</button>
      <button class="tab" data-tab="conquistas">Conquistas</button>
    </div>

    <!-- ===== TAB CRIAR ===== -->
    <div id="tab-criar" class="section active">
      <div class="status" id="status"> personalize e crie sua borboleta:</div>
      <div class="stage" id="stage"></div>
      <div class="butterfly-img" id="img"></div>
      <div class="actions" id="actions"></div>
      <div class="trait-editor" id="trait-editor">
        <label>Cor 1:</label>
        <div class="color-picker">
          <input type="color" id="color1-picker" value="#ffb74d">
        </div>
        <label>Cor 2:</label>
        <div class="color-picker">
          <input type="color" id="color2-picker" value="#ffd54f">
        </div>
        <label>Padrão:</label>
        <select id="pattern-select">
          <option value="stripes">Listras</option>
          <option value="spots">Pintas</option>
          <option value="plain">Liso</option>
        </select>
        <label>Tamanho:</label>
        <select id="size-select">
          <option value="pequeno">Pequeno</option>
          <option value="médio" selected>Médio</option>
          <option value="grande">Grande</option>
        </select>
      </div>
      <div style="margin-top:8px;text-align:center;">
        <button class="export-btn" id="export-btn" disabled title="Exportar PNG">Exportar PNG 🖼️</button>
        <button class="share-btn" id="share-btn" disabled style="background:#ffd600;color:#222;border:none;padding:7px 15px;margin-left:7px;border-radius:7px;font-weight:bold;">Compartilhar 🔗</button>
      </div>
    </div>

    <!-- ===== TAB GALERIA ===== -->
    <div id="tab-galeria" class="section">
      <div class="gallery-title" style="font-weight:bold;color:#357a38;margin-bottom:7px;">Suas borboletas adultas</div>
      <div class="miniatures" id="gallery"></div>
    </div>

    <!-- ===== TAB CONQUISTAS ===== -->
    <div id="tab-conquistas" class="section">
      <div style="font-weight:bold;color:#357a38;margin-bottom:7px;">Suas conquistas</div>
      <div class="badge-list" id="badge-list"></div>
      <div style="margin-top:10px;color:#888;font-size:0.88em;">Desbloqueie badges criando, evoluindo e acasalando!</div>
    </div>
  </div>

  <!-- Tooltip -->
  <div class="tooltip" id="tooltip" style="display:none;"></div>

<script>
// ===== OFFLINE STORAGE =====
function getStorage(key, def) {
  try { return JSON.parse(localStorage.getItem(key)) || def; } catch { return def; }
}
function setStorage(key, val) {
  try { localStorage.setItem(key, JSON.stringify(val)); } catch(e){}
}
const STORAGE_BUTTERFLIES = 'borboletario_butterflies_v2';
const STORAGE_ACHIEVEMENTS = 'borboletario_achievements_v2';

// ===== ESTADO GLOBAL =====
let butterflies = getStorage(STORAGE_BUTTERFLIES, []);
let achievements = getStorage(STORAGE_ACHIEVEMENTS, {});
let currentButterfly = null;
let currentStageIdx = 0;
let stageTimeLeft = 0;
let stageTimer = null;
let miniGameActive = false;
const STAGES = ['ovo','larva','casulo','adulto'];
const SPECIES = [
  {id:'monarca', name:'Monarca', color1:'#ffb74d', color2:'#ffd54f', pattern:'stripes', size:'médio'},
  {id:'azulada', name:'Azul‑céu', color1:'#4fc3f7', color2:'#a5d6a7', pattern:'spots', size:'pequeno'},
  {id:'nocturna', name:'Nocturna', color1:'#7e57c2', color2:'#b39ddb', pattern:'plain', size:'médio'}
];

// ===== PÁGINA COMPARTILHADA =====
function isSharePage() {
  return window.location.hash.startsWith('#share=');
}
function getShareDataFromHash() {
  try {
    const hash = window.location.hash.replace('#share=', '');
    const json = atob(hash);
    return JSON.parse(json);
  } catch { return null; }
}
function showSharePage() {
  const data = getShareDataFromHash();
  if(!data) {
    document.getElementById('share-owner').textContent = 'Borboleta não encontrada.';
    document.getElementById('share-img').innerHTML = '';
    return;
  }
  document.getElementById('main-container').style.display='none';
  document.getElementById('share-page').style.display='block';
  document.getElementById('share-owner').innerHTML = `Criada por <b>${data.owner||'Anônimo'}</b>`;
  document.getElementById('share-id').textContent = `ID: ${data.id||''}`;
  document.getElementById('share-img').innerHTML = makeSVG(data.traits, data.stage, false);
  document.getElementById('share-img').className = 'butterfly-img';
  const traits = data.traits;
  document.getElementById('share-traits').innerHTML =
    `<b>Espécie:</b> ${data.base_species||'Híbrida'} &bull; <b>Geração:</b> ${data.generation||1} &bull; <b>Padrão:</b> ${traits.pattern} &bull; <b>Cor:</b> ${traits.color1}/${traits.color2}`;
  document.getElementById('share-back').onclick = ()=>{
    document.getElementById('share-page').style.display='none';
    document.getElementById('main-container').style.display='block';
    window.history.replaceState(null, '', window.location.pathname);
    render();
  };
}

// ===== SVG GERADOR =====
function makeSVG(traits, stage, isFlying=false) {
  const w=200, h=140;
  if(stage!=='adulto') {
    return `<svg width="${w}" height="${h}" xmlns="http://www.w3.org/2000/svg"><rect x="0" y="0" width="${w}" height="${h}" fill="#e0f7fa"/><text x="${w/2}" y="${h/2}" font-size="28" fill="#00695c" text-anchor="middle" dominant-baseline="middle">${stage}</text></svg>`;
  }
  let wings='';
  if(traits.pattern==='stripes') {
    wings=`<rect x="0" y="0" width="${w/2}" height="${h}" fill="${traits.color1}"/><rect x="${w/2}" y="0" width="${w/2}" height="${h}" fill="${traits.color2}"/><line x1="100" y1="12" x2="100" y2="${h-12}" stroke="#222" stroke-width="2.6"/>`;
  } else if(traits.pattern==='spots') {
    let s=''; for(let i=0;i<9;i++) s+=`<circle cx="${45+Math.random()*110}" cy="${28+Math.random()*75}" r="3.6" fill="#222" fill-opacity="0.28"/>`;
    wings=`<rect x="0" y="0" width="${w}" height="${h}" fill="${traits.color1}"/><rect x="0" y="0" width="${w}" height="${h}" fill="${traits.color2}" fill-opacity="0.16"/>${s}`;
  } else {
    wings=`<rect x="0" y="0" width="${w}" height="${h}" fill="${traits.color1}"/><rect x="0" y="0" width="${w}" height="${h}" fill="${traits.color2}" fill-opacity="0.11"/>`;
  }
  const body=`
    <ellipse cx="${w/2}" cy="${h/2}" rx="11" ry="18" fill="#333" />
    <ellipse cx="${w/2}" cy="${h/2}" rx="6.5" ry="10" fill="${traits.color2}" />
    <line x1="${w/2}" y1="9" x2="${w/2}" y2="2" stroke="#444" stroke-width="1.8"/>
    <line x1="${w/2-3.5}" y1="9" x2="${w/2-12}" y2="2" stroke="#444" stroke-width="1.4"/>
    <line x1="${w/2+3.5}" y1="9" x2="${w/2+12}" y2="2" stroke="#444" stroke-width="1.4"/>
  `;
  return `<svg width="${w}" height="${h}" xmlns="http://www.w3.org/2000/svg">${wings}${body}</svg>`;
}

// ===== TRAITS DO EDITOR =====
function getTraitsFromEditor() {
  const color1 = document.getElementById('color1-picker').value;
  const color2 = document.getElementById('color2-picker').value;
  const pattern = document.getElementById('pattern-select').value;
  const size = document.getElementById('size-select').value;
  let base = SPECIES[0].id;
  if(color1.startsWith('#4f')||color2.startsWith('#a5')) base='azulada';
  if(color1.startsWith('#7e')||color2.startsWith('#b3')) base='nocturna';
  return {base_species:base, color1, color2, pattern, size};
}

// ===== RENDERIZAÇÃO PRINCIPAL =====
function render() {
  // Carrega galeria do localStorage
  butterflies = getStorage(STORAGE_BUTTERFLIES, []);
  // Renderiza borboleta atual
  const imgDiv = document.getElementById('img');
  if(currentButterfly) {
    currentStageIdx = STAGES.indexOf(currentButterfly.stage);
    document.getElementById('stage').textContent = currentButterfly.stage;
    imgDiv.innerHTML = makeSVG(currentButterfly.traits, currentButterfly.stage, currentButterfly.stage==='adulto');
    imgDiv.className = 'butterfly-img' + (currentButterfly.stage==='adulto'?' flying':'');
    let status = '';
    if(currentButterfly.stage==='ovo') status=`Ovo: aguarde ${stageTimeLeft}s.`;
    else if(currentButterfly.stage==='larva') status=`Lagarta: alimente para crescer (${stageTimeLeft}s).`;
    else if(currentButterfly.stage==='casulo') status=`Casulo: proteja de predadores (${stageTimeLeft}s).`;
    else if(currentButterfly.stage==='adulto') status=`Adulto! 🦋 <br><b>Espécie:</b> ${currentButterfly.base_species||'Híbrida'} <span style="font-size:0.9em;color:#8bc34a;">(Geração ${currentButterfly.generation||1})</span>`;
    document.getElementById('status').innerHTML = status;
    renderActions();
    document.getElementById('export-btn').disabled = false;
    document.getElementById('share-btn').disabled = false;
  } else {
    document.getElementById('stage').textContent = '';
    imgDiv.innerHTML = '';
    imgDiv.className = 'butterfly-img';
    document.getElementById('status').innerHTML = ' personalize e crie sua borboleta:';
    renderActions();
    document.getElementById('export-btn').disabled = true;
    document.getElementById('share-btn').disabled = true;
  }
}

// ===== AÇÕES / MINI‑JOGOS =====
function renderActions() {
  const actions = document.getElementById('actions');
  actions.innerHTML = '';
  if(!currentButterfly) {
    document.getElementById('trait-editor').style.display='flex';
    const createBtn = document.createElement('button');
    createBtn.textContent = 'Criar borboleta 🦋';
    createBtn.onclick = ()=>{
      const traits = getTraitsFromEditor();
      const id = 'b-'+Date.now()+'-'+Math.floor(Math.random()*1e5);
      const bf = {id, base_species:traits.base_species, generation:1, stage:'ovo', traits, rare:0, parents:null, owner:'Você'};
      butterflies.push(bf);
      setStorage(STORAGE_BUTTERFLIES, butterflies);
      currentButterfly = bf;
      currentStageIdx=0;
      stageTimeLeft=6;
      startTimer(6);
      unlockAchievement('primeira_criacao','Primeira Criação');
      render();
    };
    actions.appendChild(createBtn);
  } else {
    document.getElementById('trait-editor').style.display='none';
    const stage = currentButterfly.stage;
    if(stage==='ovo') {
      const btn=document.createElement('button');
      btn.textContent='Aquecer';
      btn.onclick=advanceStage;
      btn.disabled=stageTimeLeft>2;
      actions.appendChild(btn);
    } else if(stage==='larva') {
      if(!miniGameActive) {
        miniGameActive=true;
        const area = document.createElement('div');
        area.className='leaf-drag-area';
        area.innerHTML=`
          <div style="font-size:0.92em;color:#357a38;margin-right:7px;">Arraste a folha 🍃 para alimentar:</div>
          <img class="leaf" id="leaf" src="data:image/svg+xml;utf8,<svg width='32' height='32' xmlns='http://www.w3.org/2000/svg'><path d='M16 6c4.6 1.8 8.4 6.2 9.2 12 0.8 5.8-1.6 11.4-6.4 14.4-4.8 3-10.4 2-14.4-1.6-4-3.6-5.8-9.2-4.8-14C-0.2 10.8 3.2 6.8 8 6z' fill='%238bc34a' stroke='%23357a38' stroke-width='1.8'/></svg>" draggable="false">
          <div class="leaf-target" style="width:80px;height:22px;background:#e8f5e9;border:1px dashed #a5d6a7;border-radius:6px;margin-left:6px;"></div>
        `;
        actions.appendChild(area);
        let leaf = area.querySelector('.leaf');
        let isDragging=false;
        leaf.onmousedown = (e)=>{
          isDragging=true;
          leaf.style.cursor='grabbing';
        };
        document.onmouseup=(e)=>{
          if(isDragging) {
            const target = area.querySelector('.leaf-target');
            const rect = target.getBoundingClientRect();
            const over = (e.clientX>=rect.left && e.clientX<=rect.right && e.clientY>=rect.top && e.clientY<=rect.bottom);
            leaf.style.cursor='grab';
            isDragging=false;
            if(over) {
              showTooltip('Lagarta alimentada!');
              stageTimeLeft=Math.max(1, stageTimeLeft-3);
              render();
            }
          }
        };
      }
    } else if(stage==='casulo') {
      if(!miniGameActive) {
        miniGameActive=true;
        const area = document.createElement('div');
        area.className='predator-game';
        area.innerHTML=`
          <div style="font-size:0.92em;color:#d32f2f;margin-bottom:3px;">Predador se aproxima! Clique rápido:</div>
          <img class="predator-img" id="predator-img" src="data:image/svg+xml;utf8,<svg width='64' height='64' xmlns='http://www.w3.org/2000/svg'><circle cx='32' cy='32' r='30' fill='%23ef5350'/><circle cx='26' cy='28' r='5' fill='%23222'/><circle cx='38' cy='28' r='5' fill='%23222'/><path d='M18 42 Q32 56 46 42' stroke='%23222' stroke-width='2.6' fill='none'/></svg>" />
          <div style="margin-top:4px;width:64px;height:8px;background:#e0e0e0;border-radius:4px;overflow:hidden;">
            <div id="predator-meter" style="width:100%;height:8px;background:#7cb342;transition:width 0.18s;"></div>
          </div>
        `;
        actions.appendChild(area);
        let meter = area.querySelector('#predator-meter');
        let power = 100;
        let interval = setInterval(()=>{
          power=Math.max(0,power-4.2);
          meter.style.width=power+'%';
          if(power<=0) {
            clearInterval(interval);
            showTooltip('Predador atacou!');
            stageTimeLeft=Math.max(5, stageTimeLeft+3);
            render();
            setTimeout(()=>{ miniGameActive=false; area.remove(); },700);
          }
        }, 160);
        const img = area.querySelector('.predator-img');
        img.onclick=()=>{
          power=Math.min(100,power+8.5);
          meter.style.width=power+'%';
          img.style.scale='0.93';
          setTimeout(()=>img.style.scale='1',60);
          if(power>=98) {
            clearInterval(interval);
            showTooltip('Predador espantado!');
            stageTimeLeft=Math.max(1, stageTimeLeft-2);
            setTimeout(()=>{ render(); miniGameActive=false; area.remove(); },550);
          }
        };
      }
    } else if(stage==='adulto') {
      // Acasalar
      const partners = butterflies.filter(b=>b.id!==currentButterfly.id && b.stage==='adulto');
      const canMate = partners.length>0;
      const mateBtn=document.createElement('button');
      mateBtn.textContent=canMate?'Acasalar 🥰':'Sem parceiro';
      mateBtn.disabled=!canMate;
      mateBtn.onclick=canMate?()=>openMateDialog(partners):null;
      actions.appendChild(mateBtn);

      const newBtn=document.createElement('button');
      newBtn.textContent='Nova borboleta';
      newBtn.onclick=()=>{ stopTimer(); currentButterfly=null; miniGameActive=false; render(); };
      actions.appendChild(newBtn);
    }
  }
}

// ===== CICLO DE VIDA =====
function advanceStage() {
  if(!currentButterfly) return;
  stopTimer();
  if(currentButterfly.stage==='adulto') return;
  miniGameActive=false;
  const idx = STAGES.indexOf(currentButterfly.stage);
  currentButterfly.stage = STAGES[idx+1];
  const times = {ovo:6, larva:8, casulo:10, adulto:20};
  stageTimeLeft = times[currentButterfly.stage] || 6;
  // Se chegou a adulto, desbloqueia conquista
  if(currentButterfly.stage==='adulto') {
    unlockAchievement('adulto','Adulto!');
    // Chance de mutante
    if(Math.random()<0.08) {
      currentButterfly.rare = 1;
      unlockAchievement('mutante','Mutante Rara');
    }
  }
  // Salva no localStorage
  saveButterflies();
  startTimer(stageTimeLeft);
  render();
}

// ===== ACASALAMENTO =====
function openMateDialog(partners) {
  const dialog = document.createElement('div');
  dialog.style.position='fixed';
  dialog.style.left='0'; dialog.style.top='0';
  dialog.style.width='100vw'; dialog.style.height='100vh';
  dialog.style.background='rgba(33,33,33,0.52)';
  dialog.style.zIndex='1000';
  dialog.style.display='flex';
  dialog.style.alignItems='center';
  dialog.style.justifyContent='center';
  let html=`<div style="background:white;padding:18px;border-radius:10px;min-width:240px;text-align:center;"><b>Escolher parceiro(a)</b><div style="margin:8px 0;">`;
  partners.forEach(b=>{
    html+=`<div style="margin:4px;display:flex;align-items:center;gap:7px;"><span>${b.base_species||'Híbrida'}</span><button data-id="${b.id}" style="background:#7cb342;color:white;border:none;padding:5px 11px;border-radius:5px;font-size:0.95em;">Escolher</button></div>`;
  });
  html+=`</div><button onclick="this.parentElement.parentElement.remove()" style="background:#e0e0e0;color:#444;border:none;padding:5px 13px;border-radius:5px;margin-top:6px;font-size:0.95em;">Cancelar</button></div>`;
  dialog.innerHTML=html;
  document.body.appendChild(dialog);
  setTimeout(()=>{
    [...dialog.querySelectorAll('button[data-id]')].forEach(btn=>{
      btn.onclick=async()=>{
        const partnerId=btn.getAttribute('data-id');
        dialog.remove();
        await mateWith(partnerId);
      };
    });
  },10);
}
function mateWith(partnerId) {
  const partner = butterflies.find(b=>b.id===partnerId);
  if(!partner) return;
  function mix(a,b) {
    if(typeof a==='string' && a.startsWith('#')) return blendColors(a,b,0.5+(Math.random()-0.5)*0.24);
    return Math.random()<0.5?a:b;
  }
  function blendColors(a,b,r) {
    const [ra,ga,ba]=hexToRgb(a), [rb,gb,bb]=hexToRgb(b);
    return rgbToHex(ra*(1-r)+rb*r, ga*(1-r)+gb*r, ba*(1-r)+bb*r);
  }
  const childTraits = {
    color1: mix(currentButterfly.traits.color1, partner.traits.color1),
    color2: mix(currentButterfly.traits.color2, partner.traits.color2),
    pattern: mix(currentButterfly.traits.pattern, partner.traits.pattern),
    size: mix(currentButterfly.traits.size, partner.traits.size)
  };
  // Chance de mutação
  if(Math.random()<0.10) {
    childTraits.pattern=['stripes','spots','plain'][Math.floor(Math.random()*3)];
    childTraits.color1=randomColor('#ff0',60,220);
    childTraits.size=['pequeno','médio','grande'][Math.floor(Math.random()*3)];
  }
  const id='b-filho-'+Date.now()+'-'+Math.floor(Math.random()*1e6);
  const bf = {
    id, base_species:'híbrida', generation:Math.max(currentButterfly.generation||1, partner.generation||1)+1,
    stage:'ovo', traits:childTraits, rare:(Math.random()<0.08?1:0),
    parents:[currentButterfly.id, partnerId], owner:'Você'
  };
  butterflies.push(bf);
  saveButterflies();
  unlockAchievement('acasalou','Reprodução');
  stopTimer();
  currentButterfly=bf;
  currentStageIdx=0;
  stageTimeLeft=6;
  miniGameActive=false;
  startTimer(6);
  showTooltip('Nasceu uma nova borboleta! 🥚');
  render();
}

// ===== GALERIA =====
function loadGalleryAndRender() {
  butterflies = getStorage(STORAGE_BUTTERFLIES, []);
  const div = document.getElementById('gallery');
  div.innerHTML = butterflies.filter(b=>b.stage==='adulto').map(b=>{
    const mini = `<svg width="56" height="40" xmlns="http://www.w3.org/2000/svg">${makeMiniSVG(b.traits)}</svg>`;
    return `<div class="mini${b.rare?' rare':''}" onclick="window.selectButterfly('${b.id}')">${mini}<span class="mini-label">${b.base_species||'Híbrida'}</span></div>`;
  }).reverse().join('');
  // Adiciona selectButterfly ao window para o onclick do miniatura funcionar
  window.selectButterfly = function(id) {
    stopTimer();
    currentButterfly = butterflies.find(b=>b.id===id);
    miniGameActive=false;
    if(currentButterfly) startTimer(6); // mostra tempo padrão se adulto
    render();
  };
}

function makeMiniSVG(traits) {
  const w=56, h=40;
  if(traits.pattern==='stripes') {
    return `<rect x="0" y="0" width="${w/2}" height="${h}" fill="${traits.color1}"/><rect x="${w/2}" y="0" width="${w/2}" height="${h}" fill="${traits.color2}"/><line x1="${w/2}" y1="5" x2="${w/2}" y2="${h-5}" stroke="#222" stroke-width="1.8"/>`;
  } else if(traits.pattern==='spots') {
    let s=''; for(let i=0;i<5;i++) s+=`<circle cx="${12+Math.random()*32}" cy="${7+Math.random()*26}" r="2.2" fill="#222" fill-opacity="0.32"/>`;
    return `<rect x="0" y="0" width="${w}" height="${h}" fill="${traits.color1}"/>${s}`;
  } else {
    return `<rect x="0" y="0" width="${w}" height="${h}" fill="${traits.color1}"/><rect x="0" y="0" width="${w}" height="${h}" fill="${traits.color2}" fill-opacity="0.16"/>`;
  }
}

// ===== EXPORTAR PNG =====
async function exportPNG() {
  if(!currentButterfly) return;
  const svg = makeSVG(currentButterfly.traits, currentButterfly.stage, false);
  const blob = new Blob([svg], {type:'image/svg+xml'});
  const url = URL.createObjectURL(blob);
  const img = new window.Image();
  img.onload = function() {
    const canvas = document.createElement('canvas');
    canvas.width = 400; canvas.height = 280;
    const ctx = canvas.getContext('2d');
    ctx.drawImage(img, 0, 0, 400, 280);
    canvas.toBlob(function(blob2) {
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob2);
      const name = `borboleta-${currentButterfly.base_species||'híbrida'}-${currentButterfly.id.slice(-6)}.png`;
      a.download = name;
      a.click();
      URL.revokeObjectURL(a.href);
      showTooltip('Imagem exportada!');
    }, 'image/png');
  };
  img.src = url;
}

// ===== COMPARTILHAR (URL hash) =====
function shareButterfly() {
  if(!currentButterfly) return;
  // Monta objeto compartilhável
  const data = {
    id: currentButterfly.id,
    base_species: currentButterfly.base_species,
    generation: currentButterfly.generation,
    stage: currentButterfly.stage,
    traits: currentButterfly.traits,
    owner: 'Você'
  };
  const json = JSON.stringify(data);
  const hash = btoa(json);
  const url = `${window.location.origin}${window.location.pathname}#share=${hash}`;
  showShareBox(url);
}

function showShareBox(url) {
  let box = document.querySelector('.share-box');
  if(box) box.remove();
  box = document.createElement('div');
  box.className='share-box';
  box.innerHTML=`
    <input class="share-input" type="text" readonly value="${url}">
    <button class="share-copy-btn" style="background:#7cb342;color:white;border:none;padding:5px 12px;border-radius:5px;">Copiar</button>
    <span class="share-copied" style="display:none;">Copiado!</span>
  `;
  const actions = document.getElementById('actions');
  actions.appendChild(box);
  box.querySelector('.share-copy-btn').onclick=()=>{
    navigator.clipboard.writeText(url).then(()=>{
      box.querySelector('.share-copied').style.display='inline';
      setTimeout(()=>box.querySelector('.share-copied').style.display='none',1100);
    });
  };
}

// ===== CONQUISTAS =====
function loadAchievements() {
  const list = document.getElementById('badge-list');
  list.innerHTML = '<div style="color:#888;">Carregando...</div>';
  const meta = {
    'primeira_criacao': {name:'Primeira Criação', desc:'Criou sua primeira borboleta'},
    'adulto': {name:'Adulto!', desc:'Levou uma borboleta até a fase adulta'},
    'mutante': {name:'Mutante Rara', desc:'Criou uma borboleta rara por mutação'},
    'acasalou': {name:'Reprodução', desc:'Fez duas borboletas acasalarem'},
    'dez_adultas': {name:'Coleção', desc:'Chegou a 10 borboletas adultas'},
    'raridade_top10': {name:'Top 10 Rara', desc:'Sua espécie está entre as 10 mais raras'}
  };
  // Conta adultas
  const adultas = butterflies.filter(b=>b.stage==='adulto').length;
  if(adultas>=10) unlockAchievement('dez_adultas','Coleção');
  // Renderiza
  list.innerHTML = Object.entries(meta).map(([key,a])=>{
    const unlocked = achievements[key]===true;
    return `
      <div class="badge${unlocked?'':' locked'}">
        <span class="badge-icon">${unlocked?'🏆':'🔒'}</span>
        <div>
          <b>${a.name}</b><br>
          <span style="font-size:0.88em;color:${unlocked?'#357a38':'#aaa'}">${a.desc}</span>
        </div>
      </div>
    `;
  }).join('');
}
function unlockAchievement(key, name) {
  if(achievements[key]) return;
  achievements[key]=true;
  setStorage(STORAGE_ACHIEVEMENTS, achievements);
  loadAchievements();
}

// ===== TIMER =====
function startTimer(seconds) {
  stopTimer();
  stageTimeLeft = seconds;
  function tick() {
    stageTimeLeft--;
    render();
    if(stageTimeLeft<=0) { stopTimer(); advanceStage(); }
    else { stageTimer = setTimeout(tick, 1000); }
  }
  stageTimer = setTimeout(tick, 1000);
}
function stopTimer() { if(stageTimer) clearTimeout(stageTimer); stageTimer=null; }

// ===== UTILS =====
function saveButterflies() {
  setStorage(STORAGE_BUTTERFLIES, butterflies);
}
function hexToRgb(hex){hex=hex.replace('#','');if(hex.length===3)hex=hex.replace(/([0-9a-f])/gi,'$1$1');return[parseInt(hex.substr(0,2),16),parseInt(hex.substr(2,2),16),parseInt(hex.substr(4,2),16)];}
function rgbToHex(r,g,b){r=Math.round(r);g=Math.round(g);b=Math.round(b);r=Math.max(0,Math.min(255,r));g=Math.max(0,Math.min(255,g));b=Math.max(0,Math.min(255,b));return'#'+((1<<24)|(r<<16)|(g<<8)|b).toString(16).slice(1);}
function randomColor(base,min=100,max=220){const[r,g,b]=hexToRgb(base);return rgbToHex(r+(Math.random()-0.5)*40,g+(Math.random()-0.5)*40,b+(Math.random()-0.5)*40);}
function showTooltip(msg){
  let t=document.getElementById('tooltip');
  if(!t){t=document.createElement('div');t.id='tooltip';t.className='tooltip';document.body.appendChild(t);}
  t.textContent=msg;t.style.display='block';t.style.left=(200+Math.random()*160)+'px';t.style.top=(80+Math.random()*60)+'px';
  setTimeout(()=>t.style.display='none',1050);
}

// ===== TABS =====
function setupTabs() {
  document.querySelectorAll('.tab').forEach(btn=>{
    btn.onclick=()=>{
      document.querySelectorAll('.tab').forEach(b=>b.classList.remove('active'));
      btn.classList.add('active');
      document.querySelectorAll('.section').forEach(sec=>sec.classList.remove('active'));
      const tab = btn.getAttribute('data-tab');
      document.getElementById('tab-'+tab).classList.add('active');
      if(tab==='galeria') loadGalleryAndRender();
      if(tab==='conquistas') loadAchievements();
    };
  });
}

// ===== INICIALIZAÇÃO =====
(function(){
  // Verifica se estamos em página compartilhada
  if(isSharePage()) {
    showSharePage();
    return;
  }
  // Carrega conquistas do localStorage
  achievements = getStorage(STORAGE_ACHIEVEMENTS, {});
  setupTabs();
  loadAchievements();
  render();
  // Exportar PNG
  document.getElementById('export-btn').onclick = exportPNG;
  // Compartilhar
  document.getElementById('share-btn').onclick = shareButterfly;
  // Keyboard shortcut
  window.addEventListener('keydown',e=>{
    if(e.key==='Enter'&&currentButterfly&&currentButterfly.stage!=='adulto') advanceStage();
  });
})();

</script>
